<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BERL</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="index.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="screen active" data-page="home">
    <div class="logo">
      <img src="logo.png" class="logo" width="70%" alt="BERL">
    </div>

    <div class="menu">
      <button class="btn light-green" type="button" data-target="agent.html">
        <span>העלאת סוכן</span>
        <i class="fa-solid fa-calendar"></i>
      </button>

      <button class="btn teal" type="button" data-target="upload.html">
        <span>העלאת קובץ</span>
        <i class="fa-solid fa-arrow-up-from-bracket"></i>
      </button>

      <button class="btn dark-green" type="button" data-target="mailing.html">
        <span>עדכון רשימת תפוצה</span>
        <i class="fa-solid fa-users"></i>
      </button>

      <button class="btn blue-gray" type="button" data-target="mailbox.html">
        <span>עדכון תיבת דואר</span>
        <i class="fa-regular fa-envelope"></i>
      </button>
    </div>
  </main>
</body>
</html>
