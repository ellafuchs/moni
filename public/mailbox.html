<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BERL - תיבת דואר</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="index.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="screen active" data-page="mailbox">
    <button class="back-btn" type="button" data-target="index.html">← חזרה</button>

    <div class="logo">
      <img src="logo.png" class="logo" width="70%" alt="BERL">
    </div>

    <div class="mailbox-content">
      <div class="green-btn">
        <span>עדכון תיבת דואר</span>
        <span class="icon"><i class="fa-regular fa-envelope"></i></span>
      </div>

      <form class="mailbox-form mailbox-card" id="mailboxForm">
        <div class="mailbox-field">
          <label for="email">אימייל</label>
          <div class="input-shell">
            <i class="fa-regular fa-envelope"></i>
            <input id="email" class="mailbox-input" type="email" placeholder="mail@example.com" autocomplete="email" required>
          </div>
        </div>

        <div class="mailbox-field">
          <label for="password">סיסמה</label>
          <div class="input-shell">
            <i class="fa-solid fa-lock"></i>
            <input id="password" class="mailbox-input" type="password" placeholder="סיסמת תיבת הדואר" autocomplete="current-password" required>
          </div>
        </div>

        <button class="mailbox-submit mailbox-save" type="submit">שמור</button>

        <div id="error" class="mailbox-error">
          יש למלא אימייל וסיסמה תקינים
        </div>
        <div id="pageStatus" class="page-status" role="status"></div>
      </form>
    </div>
  </main>
</body>
</html>
