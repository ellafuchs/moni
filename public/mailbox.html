<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BERL - תיבת דואר</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="index.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="screen active" data-page="mailbox">
    <button class="back-btn" type="button" data-target="index.html">← חזרה</button>

    <div class="logo">
      <img src="logo.png" class="logo" width="70%" alt="BERL">
    </div>

    <div class="mailbox-content">
      <div class="green-btn">
        <span>תיבת הדואר השולחת</span>
        <span class="icon"><i class="fa-regular fa-envelope"></i></span>
      </div>

      <div class="mailbox-card mailbox-readonly">
        <div class="mailbox-field">
          <label>כתובת השולח</label>
          <div class="input-shell">
            <i class="fa-regular fa-envelope"></i>
            <span id="senderEmail" class="mailbox-input" dir="ltr">…</span>
          </div>
        </div>
        <p class="mailbox-hint">
          השליחה מתבצעת דרך Gmail API. כתובת השולח ופרטי ההרשאה של Google נשמרים רק בקובץ
          <code>.env</code> בתיקיית הפרויקט (<code>MONI_SENDER</code>, <code>GOOGLE_CLIENT_ID</code>,
          <code>GOOGLE_CLIENT_SECRET</code>, <code>GOOGLE_REFRESH_TOKEN</code>) ולא ניתן לשנותם מכאן.
        </p>
        <div id="pageStatus" class="page-status" role="status"></div>
      </div>
    </div>
  </main>
</body>
</html>
